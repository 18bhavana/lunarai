<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUNARAI — Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: #ffffff;
            background: #02040c;
        }

        /* =========================================
           SPACE BACKGROUND
        ========================================= */

        .space {
            position: fixed;
            inset: 0;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 42%,
                    rgba(70, 90, 220, 0.16),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 15%,
                    rgba(120, 70, 230, 0.12),
                    transparent 28%
                ),
                linear-gradient(
                    180deg,
                    #01030a 0%,
                    #030817 55%,
                    #01030a 100%
                );
        }

        /* =========================================
           STARS
        ========================================= */

        .stars,
        .stars-two,
        .stars-three {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .stars {
            background-image:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.95) 1px,
                    transparent 1.5px
                ),
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.6) 1px,
                    transparent 1.5px
                );

            background-size:
                150px 150px,
                260px 260px;

            background-position:
                20px 30px,
                100px 80px;

            opacity: 0.65;
        }

        .stars-two {
            background-image:
                radial-gradient(
                    circle,
                    rgba(130,190,255,0.9) 1px,
                    transparent 2px
                );

            background-size: 340px 340px;
            background-position: 60px 120px;

            opacity: 0.4;
        }

        .stars-three {
            background-image:
                radial-gradient(
                    circle,
                    #ffffff 1.5px,
                    transparent 2px
                );

            background-size: 520px 520px;
            background-position: 150px 80px;

            opacity: 0.3;
        }

        /* =========================================
           NEBULA
        ========================================= */

        .nebula {
            position: absolute;

            width: 900px;
            height: 600px;

            left: 50%;
            top: 8%;

            transform: translateX(-50%);

            background:
                radial-gradient(
                    ellipse,
                    rgba(70,100,255,0.13),
                    rgba(130,60,230,0.06) 40%,
                    transparent 72%
                );

            filter: blur(45px);

            animation:
                nebulaMove 12s ease-in-out infinite alternate;
        }

        @keyframes nebulaMove {
            from {
                transform:
                    translateX(-50%)
                    scale(1);
            }

            to {
                transform:
                    translateX(-50%)
                    scale(1.12);
            }
        }

        /* =========================================
           MOON
        ========================================= */

        .moon {
            position: absolute;

            width: 125px;
            height: 125px;

            top: 10%;
            right: 11%;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ffffff 0%,
                    #d9e2f2 22%,
                    #8998b0 52%,
                    #3a465b 78%,
                    #121827 100%
                );

            box-shadow:
                inset -18px -15px 25px rgba(0,0,0,0.45),
                0 0 30px rgba(170,200,255,0.25),
                0 0 90px rgba(100,140,255,0.12);

            animation:
                moonFloat 7s ease-in-out infinite;
        }

        .moon::before,
        .moon::after {
            content: "";
            position: absolute;

            border-radius: 50%;

            background: rgba(30,40,60,0.18);
        }

        .moon::before {
            width: 18px;
            height: 18px;

            left: 27px;
            top: 36px;
        }

        .moon::after {
            width: 12px;
            height: 12px;

            right: 30px;
            bottom: 28px;
        }

        @keyframes moonFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(10px);
            }
        }

        /* =========================================
           SMALL PLANET
        ========================================= */

        .planet {
            position: absolute;

            width: 78px;
            height: 78px;

            left: 9%;
            top: 20%;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 30% 28%,
                    #b8d6ff,
                    #526fc1 38%,
                    #1b275d 70%,
                    #060a1e
                );

            box-shadow:
                inset -15px -12px 25px rgba(0,0,0,0.55),
                0 0 30px rgba(80,130,255,0.2);
        }

        .planet::after {
            content: "";

            position: absolute;

            width: 125px;
            height: 30px;

            left: -24px;
            top: 25px;

            border:
                1px solid
                rgba(150,190,255,0.4);

            border-radius: 50%;

            transform: rotate(-18deg);
        }

        /* =========================================
           SATELLITE
        ========================================= */

        .satellite {
            position: absolute;

            width: 115px;
            height: 75px;

            right: 17%;
            top: 34%;

            transform: rotate(-10deg);

            animation:
                satelliteFloat 9s ease-in-out infinite;
        }

        @keyframes satelliteFloat {
            0%, 100% {
                transform:
                    translate(0,0)
                    rotate(-10deg);
            }

            50% {
                transform:
                    translate(-35px,18px)
                    rotate(-4deg);
            }
        }

        .satellite-body {
            position: absolute;

            width: 42px;
            height: 32px;

            left: 37px;
            top: 20px;

            border-radius: 4px;

            background:
                linear-gradient(
                    135deg,
                    #edf2fa,
                    #64728a
                );

            box-shadow:
                0 0 10px rgba(150,200,255,0.2);
        }

        .satellite-body::before {
            content: "";

            position: absolute;

            width: 23px;
            height: 23px;

            right: -16px;
            top: 4px;

            border:
                2px solid
                #d5deed;

            border-radius: 50%;
        }

        .satellite-body::after {
            content: "";

            position: absolute;

            width: 23px;
            height: 2px;

            right: -30px;
            top: 15px;

            background: #d5deed;

            transform: rotate(-15deg);
        }

        .solar-panel {
            position: absolute;

            width: 30px;
            height: 43px;

            top: 15px;

            background:
                repeating-linear-gradient(
                    90deg,
                    #142b65 0px,
                    #142b65 5px,
                    #6387d5 6px,
                    #142b65 7px
                );

            border:
                1px solid
                #809bd8;
        }

        .solar-panel.left {
            left: 2px;
        }

        .solar-panel.right {
            right: 2px;
        }

        /* =========================================
           ORBIT
        ========================================= */

        .orbit {
            position: absolute;

            width: 550px;
            height: 175px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                rotate(-14deg);

            border:
                1px solid
                rgba(130,165,255,0.11);

            border-radius: 50%;
        }

        .orbit-dot {
            position: absolute;

            width: 7px;
            height: 7px;

            right: 8%;
            top: 12%;

            border-radius: 50%;

            background: #78e8ff;

            box-shadow:
                0 0 15px #78e8ff;
        }

        /* =========================================
           SHOOTING STARS
        ========================================= */

        .shooting-star {
            position: absolute;

            width: 145px;
            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.95)
                );

            transform: rotate(-35deg);

            opacity: 0;

            animation:
                shootingStar 8s linear infinite;
        }

        .shooting-star.one {
            top: 16%;
            left: -10%;
        }

        .shooting-star.two {
            top: 40%;
            left: 43%;

            animation-delay: 4s;
        }

        @keyframes shootingStar {

            0% {
                transform:
                    translate(0,0)
                    rotate(-35deg);

                opacity: 0;
            }

            5% {
                opacity: 1;
            }

            18% {
                transform:
                    translate(600px,350px)
                    rotate(-35deg);

                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }

        /* =========================================
           MAIN CONTENT
        ========================================= */

        .content {
            position: relative;
            z-index: 20;

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding:
                30px
                20px
                145px;
        }

        /* Brand */

        .brand {
            font-size: clamp(30px, 4vw, 48px);

            font-weight: 700;

            letter-spacing: 9px;

            margin-bottom: 34px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #9ddfff,
                    #8b8cff,
                    #ffffff
                );

            background-size: 200% auto;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation:
                brandGlow 5s linear infinite;
        }

        @keyframes brandGlow {
            to {
                background-position: 200% center;
            }
        }

        .brand-line {
            display: block;

            width: 55px;
            height: 1px;

            margin:
                -20px
                auto
                35px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #72dfff,
                    transparent
                );
        }

        /* Label */

        .label {
            display: flex;
            align-items: center;

            gap: 18px;

            color: #9daac5;

            font-size: 12px;

            letter-spacing: 6px;

            text-transform: uppercase;

            margin-bottom: 30px;
        }

        .label::before,
        .label::after {
            content: "";

            width: 42px;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #7895dc
                );
        }

        .label::after {
            background:
                linear-gradient(
                    90deg,
                    #7895dc,
                    transparent
                );
        }

        /* Heading */

        h1 {
            font-size: clamp(58px, 10vw, 125px);

            line-height: 0.9;

            font-weight: 700;

            letter-spacing: -5px;

            margin-bottom: 30px;
        }

        h1 .white {
            color: #ffffff;
        }

        h1 .gradient {
            background:
                linear-gradient(
                    90deg,
                    #67e8ff,
                    #718bff,
                    #a05dff
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        /* Description */

        .description {
            max-width: 650px;

            color: #adb8cf;

            font-size: 16px;

            line-height: 1.8;

            letter-spacing: 0.8px;

            margin-bottom: 23px;
        }

        /* Collaboration */

        .interest {
            color: #75829d;

            font-size: 13px;

            margin-bottom: 17px;

            letter-spacing: 0.4px;
        }

        .interest strong {
            color: #cbd5e8;

            font-weight: 500;
        }

        /* CTA */

        .contact {
            display: inline-flex;

            align-items: center;

            gap: 11px;

            padding:
                13px
                28px;

            border:
                1px solid
                rgba(145,180,255,0.45);

            border-radius: 50px;

            background:
                rgba(10,20,50,0.35);

            color: #dce6ff;

            text-decoration: none;

            font-size: 14px;

            backdrop-filter: blur(10px);

            transition:
                transform .3s ease,
                box-shadow .3s ease,
                border-color .3s ease;
        }

        .contact:hover {
            transform: translateY(-3px);

            border-color:
                rgba(150,195,255,0.9);

            box-shadow:
                0 0 30px
                rgba(70,130,255,0.3);
        }

        .contact-icon {
            color: #76e6ff;

            font-size: 17px;
        }

        /* =========================================
           EARTH HORIZON
        ========================================= */

        .earth {
            position: absolute;

            z-index: 10;

            width: 155%;
            height: 430px;

            left: -27.5%;
            bottom: -350px;

            border-radius: 50%;

            background:
                radial-gradient(
                    ellipse at 50% 0%,
                    rgba(60,120,210,0.6),
                    rgba(15,35,85,0.55) 30%,
                    #01030a 70%
                );

            border-top:
                2px solid
                rgba(120,190,255,0.9);

            box-shadow:
                0 -8px 30px
                rgba(70,150,255,0.75),

                0 -20px 80px
                rgba(50,100,255,0.25);
        }

        .earth::before {
            content: "";

            position: absolute;

            width: 400px;
            height: 80px;

            left: 50%;
            top: -30px;

            transform:
                translateX(-50%);

            background:
                rgba(100,190,255,0.8);

            filter: blur(35px);

            border-radius: 50%;
        }

        .earth::after {
            content: "";

            position: absolute;

            width: 8px;
            height: 8px;

            left: 50%;
            top: -5px;

            transform:
                translateX(-50%);

            background: #ffffff;

            border-radius: 50%;

            box-shadow:
                0 0 15px 5px #ffffff,
                0 0 40px 15px
                rgba(80,160,255,0.8);
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .moon {
                width: 72px;
                height: 72px;

                right: 7%;
                top: 9%;
            }

            .planet {
                width: 52px;
                height: 52px;

                left: 6%;
                top: 19%;
            }

            .planet::after {
                width: 85px;
                height: 23px;

                left: -16px;
                top: 15px;
            }

            .satellite {
                right: 4%;
                top: 30%;

                transform: scale(0.7);
            }

            .orbit {
                width: 320px;
                height: 110px;
            }

            .brand {
                font-size: 27px;
                letter-spacing: 7px;
            }

            .label {
                font-size: 9px;
                letter-spacing: 4px;
                gap: 10px;
            }

            .label::before,
            .label::after {
                width: 22px;
            }

            h1 {
                font-size: 62px;
                letter-spacing: -3px;
            }

            .description {
                font-size: 14px;
                line-height: 1.7;
                max-width: 340px;
            }

            .interest {
                font-size: 12px;
            }

            .contact {
                padding:
                    12px
                    23px;
            }

            .earth {
                width: 190%;
                left: -45%;
                bottom: -285px;
            }
        }
    </style>
</head>
