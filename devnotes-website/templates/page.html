<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#4f46e5">
  <meta property="og:site_name" content="{{siteName}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="{{ogType}}">
  <meta property="og:url" content="{{canonical}}">
{{ogImage}}
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Kalam:wght@400;700&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/landing.css">
  <script>
    try { var t = localStorage.getItem('devnotes:theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
{{headExtra}}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="read-progress" id="readProgress" aria-hidden="true"></div>

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="/" aria-label="{{siteName}} home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M8.5 7 4 12l4.5 5M15.5 7 20 12l-4.5 5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-name">{{siteName}}</span>
    </a>
    <nav class="topnav" id="trackNav" aria-label="Tracks">{{nav}}</nav>
    <div class="top-actions">
      <div class="search" id="search" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" placeholder="Search notes…" autocomplete="off" spellcheck="false" aria-label="Search notes" aria-controls="searchResults" aria-expanded="false">
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
        <div class="search-results" id="searchResults" role="listbox" hidden></div>
      </div>
      <a class="support-btn" href="/support/" aria-label="Support {{siteName}}"><span aria-hidden="true">💜</span><span class="lbl">Support</span></a>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle dark mode">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Notes navigation">{{sidebar}}</aside>
    <div class="scrim" id="scrim" hidden></div>
    <main id="main" tabindex="-1" data-route="{{route}}">{{main}}</main>
  </div>

  <script src="/data/catalog.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
